<svg viewBox="24 40 1221 636" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    MONEY FLOW — "Opposing Leading the Future" side (pro-regulation)
    Cool teal accent to contrast diagram 1's warm orange.
    accent #2f7d8c | ink #2b2320 | muted #8a7d72
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="8.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#256270"/>
    </marker>
    <style>
      .eyebrow  { font-size:14px; letter-spacing:0.8px; fill:#8a9aa0; }
      .title    { font-size:26px; font-weight:700; fill:#2b2320; }
      .node     { font-size:19px; font-weight:700; fill:#2b2320; }
      .node-sub { font-size:14px; font-style:italic; fill:#7d8a90; }
      .amount   { font-size:16.5px; font-weight:700; fill:#2f7d8c; }
      .flow     { stroke:#3f95a6; stroke-width:2.5; fill:none; }
    </style>
  </defs>

  <!-- HEADER -->
  <text x="40" y="80" class="title">Midterm Political Spending Countering Leading the Future</text>

  <!-- SECTION EYEBROWS (shared y=120) -->
  <text x="168"  y="120" text-anchor="middle" class="eyebrow">THE DONORS</text>
  <text x="900"  y="120" text-anchor="middle" class="eyebrow">THE SUPER PACS</text>

  <!-- ===== DONORS (stacked left, center 168) ===== -->
  <rect x="40" y="150" width="288" height="54" rx="7" fill="#ffffff" stroke="#3f95a6" stroke-width="1.6"/>
  <text x="184" y="183" text-anchor="middle" class="node">OpenAI employees</text>

  <rect x="40" y="418" width="288" height="54" rx="7" fill="#ffffff" stroke="#3f95a6" stroke-width="1.6"/>
  <text x="184" y="451" text-anchor="middle" class="node" font-size="16">Anthropic &amp; its employees</text>

  <rect x="40" y="284" width="288" height="54" rx="7" fill="#ffffff" stroke="#3f95a6" stroke-width="1.6"/>
  <text x="184" y="317" text-anchor="middle" class="node">Unknown</text>

  <!-- ===== PUBLIC FIRST ACTION (dark-money hub, center 560) ===== -->
  <rect x="452" y="360" width="216" height="66" rx="8" fill="#e3eef1" stroke="#3f95a6" stroke-width="1.8"/>
  <text x="560" y="386" text-anchor="middle" class="node" font-size="17">Public First Action</text>
  <text x="560" y="406" text-anchor="middle" class="node-sub">Dark-money group</text>

  <!-- OpenAI employees -> Guardrails Alliance ($215K): straight across the top -->
  <path class="flow" d="M328,177 H748" marker-end="url(#arrow)"/>
  <text x="500" y="168" text-anchor="middle" class="amount">$215K</text>

  <!-- Others -> Guardrails Alliance: down-box up to Guardrails bottom-left -->
  <path class="flow" d="M328,300 H360 C376,300 376,215 392,215 H820 C838,215 838,210 866,210 V210" marker-end="url(#arrow)"/>
  <text x="560" y="207" text-anchor="middle" class="amount">~$5M</text>

  <!-- Anthropic employees -> Public First Action ($80M): step down into hub top -->
  <path class="flow" d="M328,432 H424 C440,432 440,378 452,378" marker-end="url(#arrow)"/>
  <text x="368" y="424" text-anchor="middle" class="amount">$20M</text>

  <!-- Anthropic employees -> Public First ($3.15M): step down into Public First top -->
  <path class="flow" d="M328,460 H408 C424,460 424,470 452,470" marker-end="url(#arrow)"/>
  <text x="372" y="478" text-anchor="middle" class="amount">$3.15M</text>

  <!-- ===== PUBLIC FIRST (super PAC, center 560 lower) ===== -->
  <rect x="452" y="454" width="216" height="60" rx="8" fill="#e3eef1" stroke="#3f95a6" stroke-width="1.8"/>
  <text x="560" y="479" text-anchor="middle" class="node">Public First</text>
  <text x="560" y="498" text-anchor="middle" class="node-sub">Super PAC</text>

  <!-- Public First Action -> Public First ($1M) -->
  <path class="flow" d="M560,426 V454" marker-end="url(#arrow)"/>
  <text x="584" y="444" text-anchor="middle" class="amount">$1M</text>

  <!-- ===== SUPER PACS column (center 960) ===== -->
  <!-- Guardrails Alliance (top) -->
  <rect x="756" y="150" width="220" height="60" rx="8" fill="#e3eef1" stroke="#3f95a6" stroke-width="1.8"/>
  <text x="866" y="175" text-anchor="middle" class="node">Guardrails Alliance</text>
  <text x="866" y="194" text-anchor="middle" class="node-sub">Super PAC</text>

  <!-- Defending Our Values -->
  <rect x="756" y="330" width="220" height="60" rx="8" fill="#e3eef1" stroke="#3f95a6" stroke-width="1.8"/>
  <text x="866" y="355" text-anchor="middle" class="node" font-size="17">Defending Our Values</text>
  <text x="866" y="374" text-anchor="middle" class="node-sub">Super PAC</text>

  <!-- Jobs and Democracy -->
  <rect x="756" y="560" width="220" height="60" rx="8" fill="#e3eef1" stroke="#3f95a6" stroke-width="1.8"/>
  <text x="866" y="585" text-anchor="middle" class="node">Jobs and Democracy</text>
  <text x="866" y="604" text-anchor="middle" class="node-sub">Super PAC</text>

  <!-- Abundant Future -->
  <rect x="756" y="456" width="220" height="60" rx="8" fill="#e3eef1" stroke="#3f95a6" stroke-width="1.8"/>
  <text x="866" y="481" text-anchor="middle" class="node">Abundant Future</text>
  <text x="866" y="500" text-anchor="middle" class="node-sub">Super PAC</text>

  <!-- Public First Action -> Defending Our Values ($4.3M) -->
  <path class="flow" d="M668,378 H716 C734,378 734,360 748,360" marker-end="url(#arrow)"/>
  <text x="708" y="352" text-anchor="middle" class="amount">$4.9M</text>

  <!-- Public First Action -> Abundant Future ($500K) -->
  <path class="flow" d="M668,410 H700 C718,410 718,486 748,486" marker-end="url(#arrow)"/>
  <text x="686" y="436" text-anchor="middle" class="amount">$500K</text>

  <!-- Public First -> Jobs and Democracy ($4M) -->
  <path class="flow" d="M668,494 H690 C708,494 708,590 748,590" marker-end="url(#arrow)"/>
  <text x="680" y="530" text-anchor="middle" class="amount">$4M</text>

  <!-- ===== OUTCOME: all 4 super PACs -> support & oppose ===== -->
  <!-- All four super PACs converge to a single shared outcome -->
  <path class="flow" d="M976,180 H1024 C1044,180 1044,380 1064,380" marker-end="url(#arrow)"/>
  <path class="flow" d="M976,360 H1024 C1044,360 1044,380 1064,380" marker-end="url(#arrow)"/>
  <path class="flow" d="M976,486 H1024 C1044,486 1044,380 1064,380" marker-end="url(#arrow)"/>
  <path class="flow" d="M976,590 H1024 C1044,590 1044,380 1064,380" marker-end="url(#arrow)"/>
  <text x="1150" y="376" text-anchor="middle" class="node-sub" font-size="15">Support &amp; oppose</text>
  <text x="1150" y="394" text-anchor="middle" class="node-sub" font-size="15">candidates</text>
  <text x="40" y="650" class="node-sub" font-size="14">Figures from <tspan font-style="normal">Tech Influence Watch</tspan> and <tspan font-style="normal">WIRED</tspan>.</text>
</svg>
