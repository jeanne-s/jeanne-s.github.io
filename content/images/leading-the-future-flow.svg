<svg viewBox="24 40 1206 546" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    MONEY FLOW — "Leading the Future" side (LANDSCAPE, left-to-right)
    Enlarged type, compact spacing. Palette: accent #e07a4a | ink #2b2320 | muted #8a7d72
    Column centers: donors=160, LTF=470, groups=760, LLCs=1030, terminals=1170
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="17" markerHeight="8.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d1652f"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="7" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a89a8c"/>
    </marker>
    <style>
      .eyebrow  { font-size:14px; letter-spacing:0.8px; fill:#a89a8c; }
      .title    { font-size:28px; font-weight:700; fill:#2b2320; }
      .node     { font-size:19px; font-weight:700; fill:#2b2320; }
      .node-sub { font-size:14px; font-style:italic; fill:#8a7d72; }
      .amount   { font-size:16.5px; font-weight:700; fill:#d1652f; }
      .pct      { font-size:14.5px; font-weight:700; fill:#d1652f; }
      .shell    { font-size:18px; font-weight:700; fill:#6f645a; }
      .shell-sub{ font-size:13px; font-style:italic; fill:#a89a8c; }
      .flow       { stroke:#e07a4a; stroke-width:2.5; fill:none; }
      .flow-muted { stroke:#b3a596; stroke-width:2; fill:none; stroke-dasharray:5 4; }
    </style>
  </defs>

  <!-- HEADER -->
  <text x="40" y="80" class="title">Midterm Political Spending Against AI Regulation</text>

  <!-- SECTION EYEBROWS (shared y=128) -->
  <text x="160"  y="120" text-anchor="middle" class="eyebrow">THE DONORS</text>
  <text x="470"  y="120" text-anchor="middle" class="eyebrow">THE PARENT SUPER PAC</text>
  <text x="690"  y="120" text-anchor="middle" class="eyebrow">THE SPENDING GROUPS</text>
  <text x="968" y="120" text-anchor="middle" class="eyebrow">THE SHELL LLCS</text>

  <!-- ===== DONORS (stacked, x-center 160, boxes 40-280 = 240w) ===== -->
  <rect x="40" y="140" width="256" height="54" rx="7" fill="#ffffff" stroke="#e07a4a" stroke-width="1.6"/>
  <text x="168" y="165" text-anchor="middle" class="node">Ben Horowitz</text>
  <text x="168" y="184" text-anchor="middle" class="node-sub">VC &amp; OpenAI shareholder</text>

  <rect x="40" y="204" width="256" height="54" rx="7" fill="#ffffff" stroke="#e07a4a" stroke-width="1.6"/>
  <text x="168" y="229" text-anchor="middle" class="node">Marc Andreessen</text>
  <text x="168" y="248" text-anchor="middle" class="node-sub">VC &amp; OpenAI shareholder</text>

  <rect x="40" y="268" width="256" height="54" rx="7" fill="#ffffff" stroke="#e07a4a" stroke-width="1.6"/>
  <text x="168" y="291" text-anchor="middle" class="node" font-size="15.5">Greg &amp; Anna Brockman</text>
  <text x="168" y="310" text-anchor="middle" class="node-sub">OpenAI's President &amp; his wife</text>

  <rect x="40" y="332" width="256" height="54" rx="7" fill="#ffffff" stroke="#e07a4a" stroke-width="1.6"/>
  <text x="168" y="357" text-anchor="middle" class="node">Perplexity</text>
  <text x="168" y="376" text-anchor="middle" class="node-sub">AI company</text>

  <!-- donor amounts (between boxes@280 and bus@360) -->
  <text x="334" y="161" text-anchor="middle" class="amount">$25M</text>
  <text x="334" y="225" text-anchor="middle" class="amount">$25M</text>
  <text x="334" y="289" text-anchor="middle" class="amount">$25M</text>
  <text x="334" y="353" text-anchor="middle" class="amount">$100K</text>

  <!-- donors -> vertical bus @380 -> funnel to LTF -->
  <path class="flow" d="M296,167 H380"/>
  <path class="flow" d="M296,231 H380"/>
  <path class="flow" d="M296,295 H380"/>
  <path class="flow" d="M296,359 H380"/>
  <path class="flow" d="M380,167 V359" stroke-linecap="round"/>
  <path class="flow" d="M380,263 H396" marker-end="url(#arrow)"/>

  <!-- ===== LEADING THE FUTURE (box 404-536, center 470) ===== -->
  <rect x="404" y="230" width="132" height="66" rx="8" fill="#fbe6d6" stroke="#e07a4a" stroke-width="1.8"/>
  <text x="470" y="255" text-anchor="middle" class="node" font-size="15.5">Leading</text>
  <text x="470" y="274" text-anchor="middle" class="node" font-size="15.5">the Future</text>

  <!-- split to 3 groups (right edge x=536) -->
  <path class="flow" d="M536,248 H556 C572,248 572,184 586,184" marker-end="url(#arrow)"/>
  <path class="flow" d="M536,263 H562 C578,263 578,326 586,326" marker-end="url(#arrow)"/>
  <path class="flow" d="M536,278 H556 C572,278 572,456 586,456" marker-end="url(#arrow)"/>
  <text x="558" y="172" text-anchor="middle" class="amount">$20M</text>
  <text x="584" y="266" text-anchor="middle" class="amount">$20M</text>
  <text x="556" y="448" text-anchor="middle" class="amount">$500K</text>

  <!-- ===== SPENDING GROUPS (box 626-834, center 730) ===== -->
  <rect x="586" y="156" width="208" height="58" rx="8" fill="#fbe6d6" stroke="#e07a4a" stroke-width="1.8"/>
  <text x="690" y="181" text-anchor="middle" class="node">American Mission</text>
  <text x="690" y="200" text-anchor="middle" class="node-sub">Backs pro-AI Republicans</text>

  <rect x="586" y="298" width="208" height="58" rx="8" fill="#fbe6d6" stroke="#e07a4a" stroke-width="1.8"/>
  <text x="690" y="323" text-anchor="middle" class="node">Think Big</text>
  <text x="690" y="342" text-anchor="middle" class="node-sub">Backs pro-AI Democrats</text>

  <rect x="586" y="428" width="208" height="58" rx="8" fill="#fbe6d6" stroke="#e07a4a" stroke-width="1.8"/>
  <text x="690" y="453" text-anchor="middle" class="node">Build American AI</text>
  <text x="690" y="472" text-anchor="middle" class="node-sub">501(c)(4) dark-money group</text>

  <!-- group -> LLC with % -->
  <path class="flow" d="M794,185 H860" marker-end="url(#arrow)"/>
  <path class="flow" d="M794,327 H860" marker-end="url(#arrow)"/>
  <text x="827" y="175" text-anchor="middle" class="pct">94%</text>
  <text x="827" y="317" text-anchor="middle" class="pct">97%</text>

  <!-- ===== SHELL LLCs (box 930-1146, center 1038) ===== -->
  <rect x="860" y="150" width="216" height="66" rx="8" fill="#f4efe8" stroke="#a89a8c" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="968" y="175" text-anchor="middle" class="shell" font-size="15.5">Summit Ridge Media</text>
  <text x="968" y="193" text-anchor="middle" class="shell" font-size="16">Group LLC</text>
  <text x="968" y="209" text-anchor="middle" class="shell-sub">Undisclosed vendor</text>

  <rect x="860" y="294" width="216" height="66" rx="8" fill="#f4efe8" stroke="#a89a8c" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="968" y="319" text-anchor="middle" class="shell" font-size="15.5">Lantern Production</text>
  <text x="968" y="337" text-anchor="middle" class="shell" font-size="16">Consultants LLC</text>
  <text x="968" y="353" text-anchor="middle" class="shell-sub">Undisclosed vendor</text>

  <!-- LLCs -> converge into Campaign ads terminal -->
  <path class="flow-muted" d="M1076,183 H1110 C1130,183 1130,255 1112,255" marker-end="url(#arrowMuted)"/>
  <path class="flow-muted" d="M1076,327 H1110 C1130,327 1130,255 1112,255" marker-end="url(#arrowMuted)"/>

  <!-- CAMPAIGN ADS terminal -->
  <text x="1146" y="260" text-anchor="middle" class="shell" font-size="17">Campaign ads</text>

  <!-- Build American AI -> Influence campaign terminal -->
  <path class="flow" d="M794,457 H1024" marker-end="url(#arrow)"/>
  <text x="1116" y="452" text-anchor="middle" class="shell" font-size="16">Influence campaign</text>
  <text x="1116" y="472" text-anchor="middle" class="shell-sub">Paid influencers hype U.S. AI,</text>
  <text x="1116" y="487" text-anchor="middle" class="shell-sub">frame China as a threat</text>

  <!-- FOOTNOTE -->
  <text x="40" y="526" class="node-sub" font-size="12">Dashed boxes denote shell LLCs whose vendors are not publicly disclosed. Percentages show the share of PAC funds passed through.</text>
  <text x="40" y="542" class="node-sub" font-size="12">Campaign ads support favored candidates and attack opponents such as Alex Bores. The influence campaign pays online influencers to promote</text>
  <text x="40" y="558" class="node-sub" font-size="12">U.S. AI and frame China as a threat. Figures from <tspan font-style="normal">Tech Influence Watch</tspan>, <tspan font-style="normal">Transformer</tspan>, and <tspan font-style="normal">WIRED</tspan>.</text>
</svg>
